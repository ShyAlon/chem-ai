services:
  api:
    image: ${API_IMAGE:?}
    env_file: runtime.env
    environment:
      LLM_PROVIDER: deepseek
      RELEASE_SHA: ${RELEASE_SHA:?}
      PUBLIC_HOST: ${PUBLIC_HOST:?}
      TRUST_PROXY_CLIENT_IP: "1"
      MCP_DATA_URL: http://knowledge:8000/mcp
    depends_on:
      - knowledge
    restart: unless-stopped
  knowledge:
    image: ${API_IMAGE:?}
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "homechem.knowledge_server:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:?}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
