[project]
name = "homechem"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "opentelemetry-sdk>=1.32,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.32,<2",
  "nltk>=3.9,<4",
  "spacy>=3.8,<3.9",
  "en-core-web-sm",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
